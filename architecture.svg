<svg width="960" height="660" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AI-Powered Loan Underwriting System Architecture</title>
<desc>Microservices architecture showing React UI, API Gateway, and backend services connected via Apache Kafka</desc>

